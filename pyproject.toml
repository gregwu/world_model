[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-world-model"
version = "0.1.0"
description = "Multi-timeframe latent market world model with discrete regimes and transition dynamics"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "torch>=2.2",
  "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]
