# Pure 5-minute v0.2 experiment (scripts/train_5m.py, src/mwm/intraday_model.py).
# Protocol: train 2016-2024, tune/select on 2025, 2026 FROZEN for one final out-of-sample test.
seed: 42

data:
  # Pure-intraday lazy pack (built with configs/alpaca_5m_intraday_baseline.yaml's data section: no daily arrays).
  # The daily+5m pack (data/alpaca5m/pack) drops samples whose daily window is incomplete (e.g. the 2023
  # indicators_daily gap) even though this model never reads daily data: 107M vs 100M samples, 534 vs 529 symbols.
  out_path: data/alpaca5m/pack_pure

split:
  train_start: "2016-01-01"
  train_end: "2024-12-31"
  val_start: "2025-01-01"
  val_end: "2025-12-31"
  test_start: "2026-01-01"
  test_end: "2026-12-31"
  test_frozen: true   # evaluate/transitions/diagnostics/probe refuse --split test without --final-test

model:
  d_model: 128
  nhead: 4
  num_layers: 2
  dim_feedforward: 256
  dropout: 0.10
  short_bars: 12
  session_bars: 78
  multi_bars: 455
  latent_dim: 64
  num_regimes: 64
  vq_temperature: 0.1
  vq_dead_threshold: 0.001
  stock_embedding_dim: 32
  dynamics_hidden: 128
  dynamics_head: gated   # the latent head drifted below persistence in v0.1 runs; see README "Dynamics head"
  return_hidden: 128

train:
  batch_size: 512
  epochs: 30             # the v0.1 Alpaca run was still improving at epoch 20
  samples_per_epoch: 1000000
  val_max_samples: 200000
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  patience: 4
  cross_sectional_timestamps: 8   # batches of 8 timestamps x 64 symbols, so the relative loss sees cross-sections
  vq_restart_epochs: 30           # dead-code restarts every epoch (without them the v0.1 codebook collapsed)
  dynamics_finetune_epochs: 3     # stage 2: fit only the dynamics head on the frozen best checkpoint
  amp: bf16
  device: auto
  num_workers: 4
  checkpoint: artifacts/alpaca5m_pure/best.pt

loss:
  return_weight: 1.0
  dynamics_weight: 0.5
  vq_weight: 0.25
  entropy_weight: 0.1
  relative_weight: 0.5
